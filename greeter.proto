syntax = "proto3";

package bugdays.demo;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc WatchGreetings (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
  int32 count = 2;
  repeated string tags = 3;
}

message HelloReply {
  string message = 1;
  int64 timestamp = 2;
}